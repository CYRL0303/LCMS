[project]
name = "legacy-pilot"
version = "0.1.0"
description = "Interface Contract Middleware for LegacyPilot"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "psycopg[binary]>=3.2.0",
  "PyYAML>=6.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "gitnexus_integration: requires local GitNexus runtime and is skipped by default",
  "postgres_graph_store: requires PostgreSQL and is skipped by default",
  "real_structure1_structure2_e2e: requires GitNexus runtime, PostgreSQL graph store, Structure2 graph_context, Structure3 Qwen RCA, and Structure4 PostgreSQL incident memory; skipped by default",
  "structure1_production: runs full Structure 1 Java/Spring fixture coverage",
  "slow: longer-running integration or performance tests",
  "qwen_semantic_integration: requires DashScope Qwen API access and is skipped by default",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legacy_pilot*"]
